# Submission CI for the aio-apps catalog.
#
# Two jobs, because signing and reviewing are different gates:
#   verify  — runs on every PR and push: bundle gate + unsigned build (no secrets).
#   publish — runs only on main, inside the `production` environment (manual approval), and
#             is the only place the signing key is exposed. It re-builds, signs, verifies and
#             commits `registry.json` + `artifacts/` back to the branch.
#
# The gate and the registry tool are vendored under `.aio-tools/` (copied from the AIO
# repository) so a catalog change cannot alter the checker that reviews it.
name: catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle gate (structure + style)
        run: node .aio-tools/check-app-bundle.mjs apps

      - name: Build (unsigned) and verify the payload shape
        run: |
          node .aio-tools/apps-registry-tool.mjs build --apps apps --artifacts artifacts --out registry.unsigned.json
          node .aio-tools/apps-registry-tool.mjs verify --in registry.unsigned.json

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build, sign and verify the registry
        env:
          PUBLISHER_KEY: ${{ secrets.PUBLISHER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISHER_KEY:-}" ]; then
            echo "::error::PUBLISHER_KEY is not available in this environment; refusing to publish an unsigned registry."
            exit 1
          fi
          printf '%s' "$PUBLISHER_KEY" > "$RUNNER_TEMP/publisher.key"
          node .aio-tools/apps-registry-tool.mjs build \
            --apps apps --artifacts artifacts \
            --key "$RUNNER_TEMP/publisher.key" --out registry.json
          rm -f "$RUNNER_TEMP/publisher.key"
          node .aio-tools/apps-registry-tool.mjs verify --in registry.json --pubkey "$(cat publisher.pub)"

      # `main` is review-only (see README → Governance), so generated output lives on an
      # unprotected `registry` branch. Clients read that branch (or an immutable tag).
      - name: Publish registry branch
        run: |
          set -euo pipefail
          git config user.name 'aio-catalog-bot'
          git config user.email 'aio-catalog-bot@users.noreply.github.com'
          git checkout -B registry
          git add registry.json artifacts
          if git diff --cached --quiet; then
            echo "registry unchanged"
            exit 0
          fi
          git commit -m 'chore(registry): rebuild [skip ci]'
          git push --force origin registry
